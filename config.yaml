# Cin7 reorder automation — runtime configuration.
#
# Secrets do NOT belong here. They come from the environment (see .env.example).

# ---------------------------------------------------------------------------
# Supplier scope
# ---------------------------------------------------------------------------
suppliers:
  # Which attribute on the supplier record opts a supplier into automation.
  # Opt-in, never opt-out: a newly created supplier is automated only when
  # someone deliberately sets this.
  #
  # Cin7 stores supplier attributes in ten opaque numbered slots
  # (AdditionalAttribute1 .. AdditionalAttribute10) and keeps the readable
  # labels in the attribute set definition, not on the supplier. So the slot
  # has to be named here directly.
  #
  # Confirmed against the live account: the 'Auto Reorder' checkbox lands in
  # AdditionalAttribute1 and reads as the string 'true' when ticked.
  attribute_field: "AdditionalAttribute1"

  # Only used by nested attribute shapes, which this account does not use.
  attribute_name: "Auto Reorder"

  # Values of that attribute which count as "on" (compared case-insensitively).
  truthy_values: ["yes", "true", "y", "1", "on", "enabled"]

  # Rollout pin. While this list is non-empty, ONLY these suppliers are
  # touched, regardless of how the attribute is set in Cin7. `apply` refuses
  # to run with an empty pin unless --no-pin is passed explicitly.
  #
  # Put a single supplier ID here for the first live runs.
  #
  # Set, so that the scheduled run does the same thing as the manual runs this
  # was checked against. Without it the schedule would fall back to the
  # attribute in Cin7 and quietly cover a different set of suppliers than
  # anyone has reviewed output for. Matched on an ID or a case-insensitive
  # fragment of the supplier name.
  pin:
    - BioPak
    - Somage
    - Merre

# ---------------------------------------------------------------------------
# Locations
# ---------------------------------------------------------------------------
locations:
  # Empty means every location. Otherwise a list of location names to include.
  include: []

  # Locations to leave alone entirely — no order lines, and their per-location
  # reorder points are never read. Applied after `include` and winning over it.
  #
  # Prefer this over `include` for "ignore that one warehouse". An allowlist
  # silently drops a warehouse opened later, and nothing in the report would
  # say so; a denylist lets a new one in, where the worst case is a draft
  # purchase order somebody reads and deletes.
  #
  # Names are matched ignoring case and surrounding spaces, and a name that
  # matches no warehouse on the account is reported rather than ignored.
  exclude:
    # VIC is stocked by transfer rather than direct supply, so a shortfall
    # there is a stock movement and not something to buy.
    - VIC Warehouse

# ---------------------------------------------------------------------------
# Reorder points
#
# There is nothing to configure here. Cin7 stores the reorder point itself,
# as MinimumBeforeReorder with a companion ReorderQuantity, set on the product
# and optionally overridden per location. The tool reads both.
#
# The model is a trigger, not a target: when stock reaches the minimum, order
# the reorder quantity — a fixed amount, rounded up to whole packs. That is
# what Cin7's own low-stock reorder does, which keeps the two comparable.
#
# A product with no minimum set (or a minimum of 0, which is Cin7's default)
# is skipped and reported. No reorder point means nobody has decided that
# product should be reordered automatically.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Safety caps
#
# Cheap insurance against a wrong BOM ratio or a stale par level. A line that
# trips a cap is reported, not ordered.
# ---------------------------------------------------------------------------
safety:
  # Reject any single line above this many units (boxes or base units).
  max_line_quantity: 500

  # Reject any line more than this multiple of the supplier's own reorder
  # quantity. Set to null to disable.
  max_reorder_quantity_multiple: 5

  # Reject the entire run if it would create more than this many order lines.
  # A sudden jump usually means a data problem, not a genuine restock.
  max_total_lines: 400

# ---------------------------------------------------------------------------
# Minimum order quantities
#
# Cin7 has no documented MOQ field. Until one is confirmed, MOQs live here,
# keyed by the SKU actually ordered (the box SKU, where one exists).
# ---------------------------------------------------------------------------
moq: {}
  # BOX-SLV-24: 2

# ---------------------------------------------------------------------------
# API behaviour
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Purchase orders we create
# ---------------------------------------------------------------------------
purchase:
  # Extra top-level fields to put on every purchase order this tool creates.
  #
  # Cin7 validates a POST one attribute at a time: each rejection names a
  # single missing field and says nothing about the next, and which fields are
  # mandatory depends on how the account is set up. So rather than hard-code a
  # guess, whatever this account demands goes here.
  #
  # Run `dump --purchase <id>` against a real purchase order to read the
  # values off one Cin7 has already accepted.
  #
  # SupplierID, Location, Reference and Approach are always sent and do not
  # belong here. An `Order:` block is merged rather than substituted, and any
  # `Lines` in it are ignored — replacing them would send an order for nothing.
  # These values are read off purchase order PO-81146, which Cin7 accepted.
  # Comment one out if it turns out not to be required — every field here is a
  # value this tool asserts rather than lets Cin7 decide.
  extra_fields:
    TaxRule: "GST on Expenses"
    TaxCalculation: "Exclusive"
    Terms: "30 Days EOM"
    InventoryAccount: "11500"
    BlindReceipt: false

  # The same, for every line inside the order. ProductID, SKU and Quantity are
  # always ours and cannot be overridden here — they are the entire content of
  # the decision.
  #
  # Price is deliberately absent. This tool has no view on what a thing should
  # cost, and a wrong price on a draft is worse than a blank one: blank is
  # obviously unfinished, wrong is quietly signed off.
  line_fields:
    TaxRule: "GST on Expenses"

api:
  page_size: 500
  # Abort the run rather than approach Cin7's 5000/day cap.
  daily_call_budget: 4000
  timeout_seconds: 60
  # Purchase orders are the only thing read one at a time — one call each, two
  # for an Advanced purchase, which answers a 400 before it answers anything
  # useful. The run already skips closed orders and other suppliers' orders;
  # this is the backstop if what is left is still enormous. Hitting it means
  # inbound stock is understated, so `plan` says so loudly and `apply` refuses
  # to write.
  max_purchase_details: 250
