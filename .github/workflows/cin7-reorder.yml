name: Cin7 reorder

# Twice-weekly reorder run.
#
# DELIBERATELY `plan` ONLY. It computes the reorder and uploads a report; it
# does not create or update anything in Cin7. Switching to `apply` is a
# conscious one-line change, and should not happen until:
#
#   1. `probe` passes against the live account, and
#   2. `plan` has run for at least one full supplier lead time and its numbers
#      have been checked against what you would have ordered by hand.
#
# See tools/cin7-reorder/README.md, "Known unknowns".

on:
  schedule:
    # Tuesday and Friday, 06:00 UTC.
    - cron: "0 6 * * 2,5"
  workflow_dispatch:
    inputs:
      command:
        description: "Which command to run"
        required: true
        default: plan
        type: choice
        options: [probe, plan]

permissions:
  contents: read

concurrency:
  # Never let two runs compute against the same stock at once.
  group: cin7-reorder
  cancel-in-progress: false

jobs:
  reorder:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/cin7-reorder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        # The arithmetic is the deliverable. If it regresses, do not go on to
        # produce a reorder report that looks authoritative.
        run: python -m pytest -q

      - name: Restore draft fingerprints
        # Fingerprints record what we last wrote to each draft, so a human's
        # edit can be detected and left alone. Losing them is not dangerous —
        # the tool then declines to touch existing drafts — but it does stop
        # the update path working.
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: cin7-reorder-state
          path: tools/cin7-reorder/state

      - name: Probe
        if: inputs.command == 'probe'
        env:
          CIN7_ACCOUNT_ID: ${{ secrets.CIN7_ACCOUNT_ID }}
          CIN7_APP_KEY: ${{ secrets.CIN7_APP_KEY }}
        run: |
          # probe prints to stdout; it takes no report flags.
          python -m cin7_reorder probe | tee report.md

      - name: Plan
        if: inputs.command != 'probe'
        env:
          CIN7_ACCOUNT_ID: ${{ secrets.CIN7_ACCOUNT_ID }}
          CIN7_APP_KEY: ${{ secrets.CIN7_APP_KEY }}
        run: |
          python -m cin7_reorder plan \
            --output report.md \
            --json report.json

      - name: Summarise
        if: always()
        run: cat report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cin7-reorder-report
          path: |
            tools/cin7-reorder/report.md
            tools/cin7-reorder/report.json
          retention-days: 90

      - name: Save draft fingerprints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cin7-reorder-state
          path: tools/cin7-reorder/state
          retention-days: 90
          if-no-files-found: ignore
