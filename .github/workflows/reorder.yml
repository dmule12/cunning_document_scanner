name: Cin7 reorder

# Daily reorder run. Creates DRAFT purchase orders in Cin7.
#
# It never authorises one and never emails a supplier — Cin7 has no API for
# sending a purchase order anyway. A person opens the draft, checks it, and
# clicks Email. That step is the control, and it is a human one.
#
# Run `plan` from the dispatch menu for a dry run; it writes nothing, and the
# HTTP client physically refuses non-GET requests in that mode.

on:
  schedule:
    # Every day, 08:00 Perth (AWST, UTC+8) = 00:00 UTC. Western Australia
    # does not observe daylight saving, so this holds year-round.
    #
    # Daily is safe because a run that finds nothing below its minimum
    # writes nothing, and one that finds the same shortfall as yesterday
    # updates the standing draft rather than raising another.
    #
    # A schedule only ever fires from the repository's default branch. On any
    # other branch it is inert, with nothing to say so.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "Which command to run"
        required: true
        default: plan
        type: choice
        options: [probe, plan, apply, dump, explain]
      dump_args:
        description: "Arguments for dump, e.g. --purchase <guid>, --purchases, --sku ABC"
        required: false
        default: "--purchases"
        type: string
      explain_args:
        description: "For explain: SKU or product-name fragments, space separated, e.g. chai granola napkin"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # Never let two runs compute against the same stock at once.
  group: cin7-reorder
  cancel-in-progress: false

jobs:
  reorder:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        # The arithmetic is the deliverable. If it regresses, do not go on to
        # produce a reorder report that looks authoritative.
        run: python -m pytest -q

      - name: Which command
        # A scheduled run supplies no inputs, so `apply` is what the schedule
        # means. Resolved once, here, rather than repeating the fallback in
        # every step's condition where one copy could drift from the others
        # and quietly run the wrong thing.
        id: cmd
        run: echo "value=${{ inputs.command || 'apply' }}" >> "$GITHUB_OUTPUT"

      - name: Probe
        if: steps.cmd.outputs.value == 'probe'
        env:
          CIN7_ACCOUNT_ID: ${{ secrets.CIN7_ACCOUNT_ID }}
          CIN7_APP_KEY: ${{ secrets.CIN7_APP_KEY }}
        run: |
          # probe prints to stdout; it takes no report flags. pipefail so
          # tee cannot replace probe's exit code with its own 0.
          set -o pipefail
          python -m cin7_reorder probe | tee report.md

      - name: Dump
        # Read-only diagnostics, run where the credentials already live.
        #
        # The point is that nobody has to hold the Cin7 keys locally to
        # investigate: the runner has them as secrets, and the output lands on
        # the run summary page where it can be read.
        #
        # The arguments go through the environment rather than being pasted
        # into the shell command by the expression, which would let anyone who
        # can dispatch this workflow run arbitrary commands on the runner.
        if: steps.cmd.outputs.value == 'dump'
        env:
          CIN7_ACCOUNT_ID: ${{ secrets.CIN7_ACCOUNT_ID }}
          CIN7_APP_KEY: ${{ secrets.CIN7_APP_KEY }}
          DUMP_ARGS: ${{ inputs.dump_args }}
        run: |
          case "$DUMP_ARGS" in
            *[!A-Za-z0-9\ ._/=-]*)
              echo "dump_args may only contain letters, digits, spaces and . _ - / ="
              exit 1
              ;;
          esac
          set -o pipefail
          python -m cin7_reorder dump $DUMP_ARGS | tee report.md

      - name: Explain
        # "Why is X missing from the draft?" — traces named products through
        # the run and prints where each fell out. Read-only, and the same
        # argument hygiene as dump: values reach the shell via the
        # environment, never pasted in by the expression.
        if: steps.cmd.outputs.value == 'explain'
        env:
          CIN7_ACCOUNT_ID: ${{ secrets.CIN7_ACCOUNT_ID }}
          CIN7_APP_KEY: ${{ secrets.CIN7_APP_KEY }}
          EXPLAIN_ARGS: ${{ inputs.explain_args }}
        run: |
          case "$EXPLAIN_ARGS" in
            "")
              echo "explain needs explain_args: SKU or name fragments, e.g. chai granola napkin"
              exit 1
              ;;
            *[!A-Za-z0-9\ ._/=-]*)
              echo "explain_args may only contain letters, digits, spaces and . _ - / ="
              exit 1
              ;;
          esac
          set -o pipefail
          # Unquoted on purpose: each space-separated fragment is its own
          # argument. The character guard above is what makes that safe.
          python -m cin7_reorder explain $EXPLAIN_ARGS | tee report.md

      - name: Plan
        if: steps.cmd.outputs.value == 'plan'
        env:
          CIN7_ACCOUNT_ID: ${{ secrets.CIN7_ACCOUNT_ID }}
          CIN7_APP_KEY: ${{ secrets.CIN7_APP_KEY }}
        run: |
          python -m cin7_reorder plan \
            --output report.md \
            --json report.json

      - name: Apply
        id: apply
        if: steps.cmd.outputs.value == 'apply'
        env:
          CIN7_ACCOUNT_ID: ${{ secrets.CIN7_ACCOUNT_ID }}
          CIN7_APP_KEY: ${{ secrets.CIN7_APP_KEY }}
        run: |
          python -m cin7_reorder apply \
            --output report.md \
            --json report.json

      - name: Anything needing a person
        # Nobody watches a green scheduled run. GitHub emails on failure, so
        # failing the job is the only reliable way to get attention — and once
        # this creates purchase orders unattended, two conditions genuinely
        # need it:
        #
        #   * the run aborted, so it may have written some drafts and not
        #     others; and
        #   * a draft write failed, which leaves a real, empty purchase order
        #     in Cin7 for somebody to delete.
        #
        # Ordinary warnings do not fail the run. A job that goes red twice a
        # week for something nobody needs to act on is a job people stop
        # looking at, which costs more than it saves.
        if: always() && contains(fromJSON('["plan","apply"]'), steps.cmd.outputs.value)
        run: |
          python - <<'PY'
          import json, pathlib, sys

          report = pathlib.Path("report.json")
          if not report.exists():
              print("No report.json — the run did not get far enough to write one.")
              sys.exit(1)

          data = json.loads(report.read_text())
          problems = []

          if data.get("aborted"):
              problems.append(f"Run aborted: {data['aborted']}")

          # Every warning text the pipeline can emit about a purchase order
          # that exists in Cin7 in a state a person must look at. The first
          # live empty-PO incident matched NONE of the old patterns, so the
          # job stayed green while promising to go red — a check that misses
          # its one real case is worse than no check.
          NEEDS_PERSON = (
              "Failed to write draft",
              "standing drafts",
              "returned no ID",
              "empty purchase order",
              "empty draft",
          )
          for warning in data.get("warnings", []):
              if any(marker in warning for marker in NEEDS_PERSON):
                  problems.append(warning)

          created = data.get("drafts_created") or []
          updated = data.get("drafts_updated") or []
          print(f"{len(created)} draft(s) created, {len(updated)} updated.")

          if problems:
              print("\nNeeds a person:\n")
              for problem in problems:
                  print(f"  - {problem}")
              sys.exit(1)
          PY

      - name: Summarise
        # Puts the whole report on the run's summary page, so it can be read
        # without downloading anything.
        if: always()
        run: cat report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cin7-reorder-report
          path: |
            report.md
            report.json
          retention-days: 90
          if-no-files-found: ignore
